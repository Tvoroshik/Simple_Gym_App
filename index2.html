<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASUTA — вход в личный кабинет</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --accent: #34d07c;
    --accent-dark: #1f9e5c;
    --panel: rgba(255, 255, 255, 0.05);
    --line: rgba(255, 255, 255, 0.09);
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
    color: #eef4ef;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(52, 208, 124, 0.14), transparent 45%),
      radial-gradient(ellipse at 85% 85%, rgba(52, 208, 124, 0.08), transparent 40%),
      #0a0f0c;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* Декоративные частицы-пятна на фоне */
  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb--1 {
    width: 420px;
    height: 420px;
    top: -120px;
    left: -100px;
    background: rgba(52, 208, 124, 0.16);
  }

  .glow-orb--2 {
    width: 360px;
    height: 360px;
    bottom: -100px;
    right: -80px;
    background: rgba(31, 158, 92, 0.14);
  }

  /* ===== Карточка входа ===== */
  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;

    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 48px 40px 40px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    animation: card-in .6s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Подсветка за карточкой */
  .login-card::before {
    content: '';
    position: absolute;
    inset: -60px;
    background: radial-gradient(circle at 50% 20%, rgba(52, 208, 124, 0.18), transparent 60%);
    z-index: -1;
    pointer-events: none;
  }

  /* ===== Логотип ===== */
  .logo {
    display: block;
    text-align: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-decoration: none;
    margin-bottom: 8px;
  }

  .logo span {
    color: var(--accent);
  }

  .login-subtitle {
    text-align: center;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 36px;
  }

  /* ===== Форма ===== */
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .field {
    position: relative;
  }

  .field input {
    width: 100%;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 16px 18px 16px 50px;
    outline: none;
    transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .field input::placeholder {
    color: rgba(255, 255, 255, 0.35);
    font-weight: 500;
  }

  .field input:focus {
    border-color: var(--accent);
    background: rgba(52, 208, 124, 0.06);
    box-shadow: 0 0 0 4px rgba(52, 208, 124, 0.12);
  }

  /* Иконки в полях */
  .field-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: rgba(255, 255, 255, 0.4);
    pointer-events: none;
  }

  .field input:focus ~ .field-icon {
    color: var(--accent);
  }

  /* Кнопка показать пароль */
  .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.4);
    padding: 4px;
    display: flex;
    transition: color .25s ease;
  }

  .toggle-pass:hover {
    color: var(--accent);
  }

  .toggle-pass svg {
    width: 20px;
    height: 20px;
  }

  /* ===== Строка «запомнить / забыли» ===== */
  .form-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.6);
    user-select: none;
  }

  .remember input {
    display: none;
  }

  .checkbox {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s ease, border-color .2s ease;
  }

  .remember input:checked + .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox svg {
    width: 12px;
    height: 12px;
    color: #06130b;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity .2s ease, transform .2s ease;
  }

  .remember input:checked + .checkbox svg {
    opacity: 1;
    transform: scale(1);
  }

  .forgot {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    transition: color .25s ease;
  }

  .forgot:hover {
    color: var(--accent);
  }

  /* ===== Кнопка входа ===== */
  .btn-login {
    font-family: 'Manrope', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #06130b;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(52, 208, 124, 0.3);
    transition: transform .2s, box-shadow .2s, filter .2s;
    margin-top: 8px;
  }

  .btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 38px rgba(52, 208, 124, 0.45);
    filter: brightness(1.07);
  }

  .btn-login:active {
    transform: translateY(0);
  }

  /* ===== Разделитель и соцсети ===== */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 28px 0 20px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .socials {
    display: flex;
    gap: 12px;
  }

  .social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 13px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }

  .social-btn:hover {
    background: rgba(52, 208, 124, 0.15);
    border-color: rgba(52, 208, 124, 0.4);
    color: #fff;
    transform: translateY(-2px);
  }

  /* ===== Подвал карточки ===== */
  .signup-hint {
    text-align: center;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 30px;
  }

  .signup-hint a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    transition: color .25s ease;
  }

  .signup-hint a:hover {
    color: #5fe89c;
  }

  /* Сообщение об ошибке */
  .error-msg {
    display: none;
    font-size: 13px;
    color: #ff6b7a;
    background: rgba(255, 107, 122, 0.1);
    border: 1px solid rgba(255, 107, 122, 0.3);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
  }

  .error-msg.visible {
    display: block;
  }

  @media (max-width: 480px) {
    .login-card {
      padding: 36px 24px 32px;
    }
  }
</style>
</head>
<body>

  <div class="glow-orb glow-orb--1"></div>
  <div class="glow-orb glow-orb--2"></div>

  <div class="login-card">
    <a href="index.html" class="logo">MA<span>SUTA</span></a>
    <p class="login-subtitle">Вход в личный кабинет клиента</p>

    <form class="login-form" id="loginForm" novalidate>
      <div class="field">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Показать пароль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="error-msg" id="errorMsg">Неверный email или пароль. Попробуйте ещё раз.</div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="remember">
          <span class="checkbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          Запомнить меня
        </label>
        <a href="#" class="forgot">Забыли пароль?</a>
      </div>

      <button type="submit" class="btn-login">Войти</button>
      <p class="signup-hint">Ещё нет аккаунта? <a href="#" id="signupLink">Написать тренеру</a></p>
    </form>
    <a href="index-admin.html" id="signupLink">Админ</a></p>
    <a href="index-trainer.html" id="signupLink">Тренер</a></p>
    <a href="index-client.html" id="signupLink">Клиент</a></p>
  </div>

<script>
  // Показать/скрыть пароль
  const passInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePass');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passInput.type === 'password';
    passInput.type = isHidden ? 'text' : 'password';
    toggleBtn.style.color = isHidden ? '#34d07c' : '';
  });

  // Демо-проверка формы (потом заменим на реальный бэкенд)
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = passInput.value;
    const errorMsg = document.getElementById('errorMsg');

    if (!email || !pass) {
      errorMsg.textContent = 'Заполните оба поля.';
      errorMsg.classList.add('visible');
      return;
    }

    // Заглушка: здесь будет запрос на сервер или в Telegram-бота
    errorMsg.textContent = 'Вход пока в демо-режиме: сервер не подключён.';
    errorMsg.classList.add('visible');
  });

  // Ссылка «Написать тренеру» — ведёт на страницу контактов
  document.getElementById('signupLink').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = 'index.html#contacts';
  });
</script>

</body>
</html>
